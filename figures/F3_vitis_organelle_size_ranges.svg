<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img">
  <title>F3. Vitis organelle size ranges (JIPB 2025)</title>
  <rect width="820" height="430" fill="#fffef8"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="18" fill="#1a1a1a">F3. Vitis organelle size ranges (JIPB 2025)</text>
<line x1="80.0" y1="120" x2="700.0" y2="120" stroke="#ccc" stroke-width="1"/>
<rect x="189.54091111111111" y="110" width="3.1743999999999915" height="20" fill="#3d7a40" stroke="#222"/>
<text x="80" y="102" font-family="Georgia, serif" font-size="13">Plastid genomes, 33 Vitis accessions (159,011-163,619 bp)</text>
<text x="189.54091111111111" y="148" font-family="Georgia, serif" font-size="11">159.011</text>
<text x="182.7153111111111" y="148" font-family="Georgia, serif" font-size="11">163.619 kb</text>
<line x1="80.0" y1="200" x2="700.0" y2="200" stroke="#ccc" stroke-width="1"/>
<rect x="536.8435555555556" y="190" width="106.23355555555554" height="20" fill="#8b3a2a" stroke="#222"/>
<text x="80" y="182" font-family="Georgia, serif" font-size="13">Mitochondrial genomes, 33 Vitis accessions (663.16-817.37 kb)</text>
<text x="536.8435555555556" y="228" font-family="Georgia, serif" font-size="11">663.16</text>
<text x="633.0771111111111" y="228" font-family="Georgia, serif" font-size="11">817.37 kb</text>
<text x="80" y="270" font-family="Georgia, serif" font-size="13">NUMTs 212-431; NUPTs 95-205 (same 33-accession study).</text>
<text x="80" y="292" font-family="Georgia, serif" font-size="13">Grapepan_mt v.1.0 = 1.28 Mb; Grapepan_cp v.1.0 = 138 kb.</text>
<text x="390" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="12">Scale in kb</text>
<line x1="80.0" y1="340" x2="80.0" y2="350" stroke="#333"/>
<text x="80.0" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="11">0</text>
<line x1="183.33333333333331" y1="340" x2="183.33333333333331" y2="350" stroke="#333"/>
<text x="183.33333333333331" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="11">150</text>
<line x1="286.66666666666663" y1="340" x2="286.66666666666663" y2="350" stroke="#333"/>
<text x="286.66666666666663" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="11">300</text>
<line x1="390.0" y1="340" x2="390.0" y2="350" stroke="#333"/>
<text x="390.0" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="11">450</text>
<line x1="493.3333333333333" y1="340" x2="493.3333333333333" y2="350" stroke="#333"/>
<text x="493.3333333333333" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="11">600</text>
<line x1="596.6666666666666" y1="340" x2="596.6666666666666" y2="350" stroke="#333"/>
<text x="596.6666666666666" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="11">750</text>
<line x1="700.0" y1="340" x2="700.0" y2="350" stroke="#333"/>
<text x="700.0" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="11">900</text>
  <text x="24" y="402" font-family="Georgia, serif" font-size="11" fill="#333">Ranges from Hou et al., JIPB 2025, doi:10.1111/jipb.13968, full text.</text>
  <text x="24" y="418" font-family="Georgia, serif" font-size="11" fill="#333">Original chart, not a journal reprint.</text>
